<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <div id="result" aria-live="polite"></div>
  <script type="module">
    const form = document.querySelector("form");
    const result = document.querySelector("#result");
    const topicLabels = { delivery: "Доставка", pricing: "Цена", other: "Другое" };

    function show(message) {
      const paragraph = document.createElement("p");
      paragraph.textContent = message;
      result.replaceChildren(paragraph);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.replaceChildren();
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const data = await reply.json();
        if (data.status === "ready") {
          const topic = document.createElement("p");
          topic.textContent = `Тема: ${topicLabels[data.topic] ?? data.topic}`;
          const draft = document.createElement("pre");
          draft.textContent = `Черновик ответа:\n${data.draft}`;
          result.replaceChildren(topic, draft);
        } else if (data.status === "manual_review") {
          show("Не удалось автоматически разобрать заявку. Проверьте её вручную и подготовьте ответ клиенту.");
        } else {
          show("Введите текст заявки и попробуйте снова.");
        }
      } catch {
        show("Сервер недоступен. Попробуйте ещё раз позже.");
      }
    });
  </script>
</body>
</html>
